# This workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# To get started:

# 1. Add your Datadog API (DD_API_KEY) and Application Key (DD_APP_KEY) as secrets to your GitHub repository. For more information, see: https://docs.datadoghq.com/account_management/api-app-keys/.
# 2. Start using the action within your workflow

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Verify if Datadog credentials exist in GitHub Secrets
    - name: Verify Datadog Credentials
      id: check_keys
      env:
        DD_API_KEY: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      run: |
        if [ -z "$DD_API_KEY" ] || [ -z "$DD_APP_KEY" ]; then
          echo "has_keys=false" >> $GITHUB_OUTPUT
          echo "::notice title=Datadog CI::Datadog API key (DD_API_KEY) or Application key (DD_APP_KEY) is not yet set in GitHub repository secrets. Skipping Synthetic tests. Add them in GitHub Settings > Secrets and variables > Actions."
        else
          echo "has_keys=true" >> $GITHUB_OUTPUT
          echo "Datadog credentials verified."
        fi

    # Run Synthetic tests only when credentials are provided
    - name: Run Datadog Synthetic tests
      if: steps.check_keys.outputs.has_keys == 'true'
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{ secrets.DD_API_KEY }}
        app_key: ${{ secrets.DD_APP_KEY }}
        datadog_site: ${{ secrets.DD_SITE || 'datadoghq.com' }}
        test_search_query: 'tag:e2e-tests' # Modify this tag to suit your tagging strategy


